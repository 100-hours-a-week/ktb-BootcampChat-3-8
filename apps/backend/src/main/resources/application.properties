# Server Configuration
server.port=${PORT:5001}

server.tomcat.threads.max=10
server.tomcat.threads.min-spare=1
server.tomcat.accept-count=10
server.tomcat.max-connections=50

# Database Configuration
app.mongodb.mode=${MONGO_MODE:standalone}
app.mongodb.uri=${MONGO_URI:}
app.mongodb.database=${MONGO_DATABASE:bootcamp-chat}
app.mongodb.host=${MONGO_HOST:localhost}
app.mongodb.port=${MONGO_PORT:27017}
app.mongodb.username=${MONGO_USERNAME:}
app.mongodb.password=${MONGO_PASSWORD:}
app.mongodb.auth-database=${MONGO_AUTH_DB:admin}
app.mongodb.replica-set.name=${MONGO_REPLICA_SET_NAME:rs0}
app.mongodb.replica-set.hosts=${MONGO_REPLICA_HOSTS:}
app.mongodb.replica-set.options=${MONGO_REPLICA_OPTIONS:readPreference=primaryPreferred&w=majority&retryWrites=true}

spring.data.mongodb.database=${app.mongodb.database}
spring.data.mongodb.auto-index-creation=true

# Redis Configuration
# Mode: standalone (로컬 개발) 또는 cluster (프로덕션)
spring.data.redis.mode=${REDIS_MODE:standalone}

# Standalone 모드 설정 (로컬 개발용)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Cluster 모드 설정 (프로덕션용)
# 예: redis-node1:6379,redis-node2:6379,redis-node3:6379
spring.data.redis.cluster.nodes=${REDIS_CLUSTER_NODES:}

# 공통 설정
spring.data.redis.timeout=${REDIS_TIMEOUT:3000}

# Cache Configuration
# 캐시 TTL 설정 (예: 24h, 30m, 1d)
cache.user.ttl=${CACHE_USER_TTL:24h}
cache.user-profile.ttl=${CACHE_USER_PROFILE_TTL:24h}
cache.room-participants.ttl=${CACHE_ROOM_PARTICIPANTS_TTL:30m}
cache.default.ttl=${CACHE_DEFAULT_TTL:30m}


file.upload-dir=./uploads

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Security Configuration
app.encryption.key=${ENCRYPTION_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.encryption.salt=${ENCRYPTION_SALT:3132333435363738}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}

# Socket.IO Server Configuration
socketio.server.host=0.0.0.0
socketio.server.port=${WS_PORT:5002}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ktb.chatapp=INFO
logging.level.org.mongodb=INFO

# Content Moderation
chatapp.banned-word.location=classpath:fake_banned_words_10k.txt

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.packages-to-scan=com.ktb.chatapp.controller
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name:ktb-chat-backend}
# Inject HOSTNAME environment variable if available
management.metrics.tags.host=${HOSTNAME:unknown}
